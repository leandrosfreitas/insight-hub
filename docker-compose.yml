services:
  db:
    image: postgres:16
    container_name: insighthub_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: insighthub_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: insighthub_api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:123456@db:5432/insighthub_db
      ENV: production
      SECRET_KEY: supersecretkey123
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build: ./frontend
    container_name: insighthub_frontend
    ports:
      - "4173:4173"
    depends_on:
      - api

  airflow:
    image: apache/airflow:2.8.1
    container_name: insighthub_airflow
    command: airflow standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
