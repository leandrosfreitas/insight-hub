<svg width="220" height="80" viewBox="0 0 220 80" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Ícone (gráfico + círculo) -->
  <g transform="translate(0,5)">
    
    <!-- círculo -->
    <circle cx="35" cy="35" r="30" stroke="url(#grad1)" stroke-width="4" fill="none"></circle>

    <!-- barras -->
    <rect x="20" y="40" width="6" height="15" fill="#2563eb"></rect>
    <rect x="30" y="30" width="6" height="25" fill="#16a34a"></rect>
    <rect x="40" y="20" width="6" height="35" fill="#2563eb"></rect>

    <!-- linha -->
    <polyline points="23,38 33,28 43,18" fill="none" stroke="#16a34a" stroke-width="2"></polyline>
  </g>

  <!-- Texto -->
  <text x="75" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    <tspan fill="#1e3a8a">Insight</tspan>
    <tspan fill="#22c55e">Hub</tspan>
  </text>

  <!-- Gradiente -->
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"></stop>
      <stop offset="100%" stop-color="#22c55e"></stop>
    </linearGradient>
  </defs>

</svg>